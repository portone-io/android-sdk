name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  changesets:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to commit version updates.
      pull-requests: write # Required to open or update the release pull request.
    outputs:
      hasChangesets: ${{ steps.changesets-action.outputs.hasChangesets }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Setup Node.js 24.x
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create Release Pull Request
        id: changesets-action
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d
        with:
          version: pnpm run version
          commit: "ci: release"
          title: "ci: release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  version:
    name: Check Version
    runs-on: ubuntu-latest
    needs: changesets
    if: needs.changesets.outputs.hasChangesets == 'false'
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version-check.outputs.version }}
      version-changed: ${{ steps.version-check.outputs.changed }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Check version changes
        id: version-check
        uses: EndBug/version-check@095362f3cd50f690c8fa0e6afeea81834bd8d320
        with:
          diff-search: true
          file-name: package.json

  build:
    name: Build SDK
    runs-on: ubuntu-latest
    needs: version
    if: needs.version.outputs.version-changed == 'true'
    permissions:
      contents: read
    outputs:
      version: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Setup JDK 17
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92

      - name: Build SDK
        run: ./gradlew :sdk:assembleRelease

  publish:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.version
    # Required to create the GitHub release and tag.
    permissions:
      contents: write # Required to create the GitHub release and tag.
    steps:
      - name: Checkout Repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Create GitHub Release and Tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "${RELEASE_VERSION}" \
            --title "v${RELEASE_VERSION}" \
            --generate-notes
